name: Terraform

# Manual trigger only - no auto-run on push or PR.
# Go to Actions tab -> Terraform -> "Run workflow" -> pick environment + action.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to target"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - prod
      action:
        description: "plan = preview changes only, apply = actually create/update resources"
        required: true
        type: choice
        default: "plan"
        options:
          - plan
          - apply

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  TF_VERSION: "1.11.4" # 1.10+ required for use_lockfile (S3 native locking)
  AWS_REGION: "ap-south-1"

jobs:
  terraform:
    runs-on: ubuntu-latest
    # prod + apply routes through the "prod" GitHub Environment, so if you've
    # set up a required reviewer there, this run will pause for approval.
    environment: ${{ inputs.environment == 'prod' && inputs.action == 'apply' && 'prod' || '' }}
    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve
